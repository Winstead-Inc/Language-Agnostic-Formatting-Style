name: Release Binary

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          Copy-Item "target/release/Language-Agnostic-Formatting-Style.exe" "Language-Agnostic Formatting Style.exe"
          Copy-Item "target/release/Language-Agnostic-Formatting-Style.exe" "LAFS.exe"

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "$env:GITHUB_REF_NAME - Language-Agnostic Formatting Style (LAFS)" `
            --generate-notes `
            "Language-Agnostic Formatting Style.exe" `
            "LAFS.exe"

      - name: Publish Rolling Latest Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y 2>$null
          gh release create latest `
            --title "Latest Release" `
            --notes "Continuous build from main branch." `
            "Language-Agnostic Formatting Style.exe" `
            "LAFS.exe"
