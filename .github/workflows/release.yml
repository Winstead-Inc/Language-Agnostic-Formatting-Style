name: Release Binary

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          Copy-Item "target/release/Language-Agnostic-Formatting-Style.exe" "LAFS.exe"

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "$env:GITHUB_REF_NAME - LAFS" `
            --generate-notes `
            --latest `
            "LAFS.exe"

      - name: Publish Main Branch Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ReleaseTag = "v0.1.$env:GITHUB_RUN_NUMBER"
          gh release create $ReleaseTag `
            --title "Release $ReleaseTag - LAFS" `
            --notes "Continuous build from commit $env:GITHUB_SHA." `
            --latest `
            "LAFS.exe"
