name: Release Binary

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          Copy-Item "target/release/Language-Agnostic-Formatting-Style.exe" "Language-Agnostic Formatting Style.exe"
          Copy-Item "target/release/Language-Agnostic-Formatting-Style.exe" "LAFS.exe"

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Language-Agnostic Formatting Style.exe
            LAFS.exe
          generate_release_notes: true

      - name: Publish Rolling Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          files: |
            Language-Agnostic Formatting Style.exe
            LAFS.exe
          prerelease: false
